name: Security

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        # Weekly, so new advisories are caught without needing a code change.
        - cron: '17 5 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
              with:
                  languages: javascript-typescript
                  queries: security-extended

            - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

    scanners:
        name: Scanners
        # ci.yml runs `just ci`, which already includes `just security`, on every
        # push and pull request. Running it again here would scan the same tree
        # twice. What this job adds is the weekly schedule: the same scanners
        # against unchanged code, catching advisories published since the last
        # commit.
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

            # Same recipe as `just security` locally: gitleaks, trivy, osv-scanner,
            # actionlint and zizmor, all pinned by mise.toml.
            - run: just security
